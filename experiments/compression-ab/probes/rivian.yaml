# rivian 코퍼스 프로브 — 세션 20260720_230652_441de6 (Rivian R2 경쟁 분석)
#
# 실행 전에 확정한다. 요약을 본 뒤에 만들면 채점이 오염된다.
#
# 이 코퍼스는 web_search/web_extract가 대부분이라 파일 경로가 거의 없다.
# 대신 수치(EPA 제원, roadload 계수)가 458개로 밀도가 높아
# "숫자가 4세대를 살아남는가"를 재기에 적합하다.

corpus: rivian
session_id: 20260720_230652_441de6
summary: |
  사용자가 Rivian R2의 EPA 공식 데이터와 roadload coefficients를 수집해
  Tesla Model Y와 speed vs load(N) 그래프로 비교하고,
  x축 가격 y축 성능으로 경쟁차와 비교하라고 요청.
  경쟁차는 동일 세그먼트로만 한정.
  web 검색을 반복하다 도구 호출 한계에 걸려 표로 정리해 보고.
  사용자가 "그런 폴더가 안보임"이라고 지적하자 실제 파일 생성으로 방향 전환.

probes:
  - id: P1
    kind: resume
    weight: 2
    question: |
      이 인수인계 문서를 보고 답하라. 지금 진행 중인 작업이 무엇이고,
      작업을 이어받는 사람이 다음에 해야 할 일은 무엇인가? 3문장 이내로.
    answer: |
      Rivian R2의 EPA 공식 데이터와 roadload 계수를 수집해 Tesla Model Y 등
      동급 경쟁차와 비교 분석하는 작업. 데이터 수집은 상당히 진행됐으나
      결과물 파일(그래프·비교표)이 실제로 만들어지지 않았다.
      다음 단계는 수집한 데이터로 그래프를 그리고 파일로 저장하는 것.
    must_include:
      - ["rivian", "r2", "리비안"]
      - ["그래프", "파일", "차트", "비교표", "생성", "만들"]
    must_not:
      - "작업이 모두 완료"

  - id: P2
    kind: early_fact          # "동일 세그먼트로만"은 G1에만 등장
    weight: 3
    question: |
      이 인수인계 문서를 보고 답하라. 비교 대상 경쟁차를 고를 때
      사용자가 건 제약 조건이 있는가? 있다면 그대로 적어라.
      없으면 "없음"이라고만 답하라.
    answer: |
      동일한 세그먼트의 차량으로만 비교할 것.
      (지목된 예: Tesla Model Y, 현대 아이오닉 5, BMW iX3 등 최근 전기차)
    must_include:
      - ["세그먼트", "segment", "동급", "같은 급"]
    must_not:
      - "없음"

  - id: P3
    kind: decision
    weight: 2
    question: |
      이 인수인계 문서를 보고 답하라. 사용자가 요청한 그래프의 축을
      어떻게 잡으라고 했는가? 그래프가 몇 종류인지도 함께 답하라.
    answer: |
      두 종류다. (1) roadload 비교 그래프 — x축 speed, y축 load(N).
      (2) 가격 대비 성능 그래프 — x축 가격, y축 성능.
    must_include:
      - ["speed", "속도"]
      - ["load", "하중", "N"]
      - ["가격", "price"]
      - ["성능", "performance"]

  - id: P4
    kind: correction          # 사용자의 지적 — reverse signal 처리
    weight: 3
    question: |
      이 인수인계 문서를 보고 답하라. 사용자가 결과물에 대해 지적하거나
      방향을 바꾼 적이 있는가? 있다면 무엇을 지적했는가?
    answer: |
      사용자가 "그런 폴더가 안보임"이라고 지적했다.
      보고만 하고 실제 파일·폴더를 만들지 않았다는 뜻이며,
      이후 실제로 파일을 생성하는 쪽으로 방향이 바뀌었다.
    must_include:
      - ["폴더", "파일", "folder"]
      - ["안보", "없", "안 보", "지적", "만들지"]
    must_not:
      - "없음"

  - id: P5
    kind: pending
    weight: 3
    question: |
      이 인수인계 문서를 보고 답하라. 사용자가 요청한 것 중
      아직 끝나지 않은 일이 있는가? 있다면 구체적으로 무엇인가?
    answer: |
      그래프 생성과 파일 저장이 남아 있다.
      speed vs load 그래프, 가격 대비 성능 그래프 모두 실제 파일로
      만들어지지 않았고, 사용자가 폴더가 안 보인다고 지적한 상태다.
    must_include:
      - ["그래프", "파일", "차트"]
      - ["남", "아직", "미완", "안 됐", "필요"]
    must_not:
      - "없음"
      - "모두 완료"
