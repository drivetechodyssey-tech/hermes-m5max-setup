# 합성 코퍼스 프로브 — threshold 0.35/0.35 vs 0.65/0.65 비교용
#
# 코퍼스 배치:
#   맨 앞  vault(7c4e67)   → P2의 출처. 압축을 전부 겪는다.
#   중간   패딩 3개 세션
#   맨 뒤  rivian(441de6)  → P1/P4/P5의 출처. 마지막 기준이라 그대로 유효.
#
# 이 실험의 핵심 지표는 P2다.
# 두 설정은 압축 대상·요약 예산·압축 주기가 전부 같고 tail만 3.4배 다르다.
# 그 차이는 "압축 후 컨텍스트 중 요약이 차지하는 비율"로 나타난다
# (27.1% vs 9.7%). 원문 비율이 높은 쪽이 초기 정보를 더 잘 지키는지를
# P2가 직접 잰다 — 대화 맨 앞의 지시가 네 번의 압축을 살아남는가.

corpus: synth
summary: |
  여러 세션을 이어붙인 합성 대화. 맨 앞은 Obsidian 볼트 정리 작업이고
  맨 뒤는 Rivian R2 경쟁 분석이다.

probes:
  - id: P2
    kind: early_fact          # 맨 앞 세션에만 등장 — 누적 열화의 직격 지표
    weight: 4
    question: |
      이 컨텍스트를 보고 답하라. 대화 초반에 사용자가 "반드시 기억"하라고
      명시한 것이 있는가? 있다면 그 내용을 그대로 적어라.
      없으면 "없음"이라고만 답하라.
    answer: |
      Obsidian 볼트의 위치. 프로젝트 폴더 안의 second_brain 폴더 안의
      second_brain 폴더 — 즉 ~/Projects/second_brain/second_brain/
    must_include:
      - ["second_brain", "second brain"]
      - ["볼트", "vault", "위치", "경로", "obsidian", "옵시디언"]
    must_not:
      - "없음"

  - id: P1
    kind: resume
    weight: 2
    question: |
      이 컨텍스트를 보고 답하라. 지금 진행 중인 작업이 무엇이고,
      이어받는 사람이 다음에 해야 할 일은 무엇인가? 3문장 이내로.
    answer: |
      Rivian R2의 EPA 데이터와 roadload 계수를 수집해 Tesla Model Y 등
      동급 경쟁차와 비교하는 작업. 데이터 수집은 진행됐으나 결과물 파일
      (그래프·비교표)이 만들어지지 않았다.
    must_include:
      - ["rivian", "r2", "리비안"]
      - ["그래프", "파일", "차트", "비교", "데이터"]
    must_not:
      - "작업이 모두 완료"

  - id: P4
    kind: correction
    weight: 3
    question: |
      이 컨텍스트를 보고 답하라. 사용자가 결과물에 대해 지적하거나
      방향을 바꾼 적이 있는가? 있다면 무엇을 지적했는가?
    answer: |
      사용자가 "그런 폴더가 안보임"이라고 지적했다.
      보고만 하고 실제 파일·폴더를 만들지 않았다는 뜻이다.
    must_include:
      - ["폴더", "파일", "folder"]
      - ["안보", "없", "안 보", "지적", "만들지"]
    must_not:
      - "없음"

  - id: P5
    kind: pending
    weight: 3
    question: |
      이 컨텍스트를 보고 답하라. 사용자가 요청한 것 중
      아직 끝나지 않은 일이 있는가? 있다면 구체적으로 무엇인가?
    answer: |
      그래프 생성과 파일 저장이 남아 있다. speed vs load 그래프,
      가격 대비 성능 그래프가 실제 파일로 만들어지지 않았다.
    must_include:
      - ["그래프", "파일", "차트"]
      - ["남", "아직", "미완", "안 됐", "필요"]
    must_not:
      - "없음"
      - "모두 완료"
